[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openibkr-helper"
version = "0.2.0"
description = "Local-only, read-only IBKR data helper for OpenIBKR"
requires-python = ">=3.13,<3.14"
dependencies = [
  "ibapi==10.49.2",
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "uvicorn>=0.35,<1",
  "websockets>=14,<17",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2,<3",
  "ruff>=0.12,<1",
]
packaging = [
  "pyinstaller>=6.14,<7",
]

[project.scripts]
openibkr-readonly-spike = "openibkr_spike.cli:main"
openibkr-helper = "openibkr_helper.main:main"
openibkr-helper-live-smoke = "openibkr_helper.live_smoke:main"

[tool.setuptools]
package-dir = {"" = "helper/src"}

[tool.setuptools.packages.find]
where = ["helper/src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
